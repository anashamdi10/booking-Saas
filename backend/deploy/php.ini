; PHP settings applied on Wasmer Edge (see docs/DEPLOY_WASMER.md).
; The local machine keeps using its own php.ini — this file is only mounted
; into the deployed package through PHPRC.

; Skip stat() on every request: the package files never change while running.
opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0

; Keep in step with MEDIA_MAX_UPLOAD_KB (20 MB) in the API's configuration.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
